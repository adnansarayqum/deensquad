# Every push and pull request: types, lint, unit tests, then every end-to-end test in Chrome and the Friday smoke
# test in WebKit (Safari's engine) on an iPhone screen. Added after the gate scanner failed on Fri 30 Oct 2026.
# Railway deploys main on its own; this run tells you within about 20 minutes if something is broken.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_WEBKIT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/.results
          retention-days: 7
